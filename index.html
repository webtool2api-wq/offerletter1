<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offer Letter PDF Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--surf:#f1f4f8;--ink:#0b1b3a;--mute:#5a6781;--blue:#1e6bff;--line:#d5dce8;--err:#b42318;--desk:#8a93a3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1220;--surf:#141d30;--ink:#e8eefc;--mute:#9aa8c7;--blue:#4c8dff;--line:#26324d;--err:#ff7b72;--desk:#2a3245}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--surf:#141d30;--ink:#e8eefc;--mute:#9aa8c7;--blue:#4c8dff;--line:#26324d;--err:#ff7b72;--desk:#2a3245}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Calibri,Carlito,system-ui,sans-serif}
#app{display:flex;height:100%}
#ctl{width:460px;flex:none;overflow-y:auto;padding:16px;border-right:1px solid var(--line)}
#pv{flex:1;min-width:0;overflow:auto;background:var(--desk);padding:20px}
.pgc{display:block;width:100%;max-width:720px;margin:0 auto 18px;box-shadow:0 2px 10px rgba(0,0,0,.35);background:#fff}
h1{font-size:20px;margin:0}.m{color:var(--mute);margin:2px 0 10px;font-size:13px}
.er{color:var(--err);min-height:0;margin-bottom:6px}
details{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:0 12px}
summary{cursor:pointer;font-weight:700;padding:10px 0}
details[open]{padding-bottom:10px}
label{display:block;font-size:12px;color:var(--mute);margin-top:8px}
input,textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-top:2px}
textarea{resize:vertical}
input[type=checkbox]{width:auto}
button{font:inherit;border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer;margin:8px 6px 0 0}
.go{display:block;width:100%;background:var(--blue);color:#fff;border:0;padding:13px;font-size:16px;font-weight:700;margin:6px 0 0;position:sticky;bottom:0}
.sc{width:100%;overflow-x:hidden;margin-top:8px}
.ed{border-collapse:collapse;width:100%;table-layout:fixed}
.ed td,.ed th{padding:3px 2px;vertical-align:middle;min-width:0}
.ed th{position:sticky;top:0;z-index:2;background:var(--bg)}
.ed .sn{width:44px;text-align:center;color:var(--mute);font-size:11px;vertical-align:middle;padding-top:4px}
.ed .sn .ico-edit{margin:0 2px 0 0;padding:4px 6px;font-size:14px;line-height:1;border-radius:4px;background:var(--surf);border:1px solid var(--line);cursor:pointer;color:var(--ink);vertical-align:middle}
.ed .sn .ico-edit:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.ed .sn .num{font-weight:600;font-size:12px;vertical-align:middle}
.ed th textarea{ text-align:center;font-weight:700;min-height:30px;height:30px;overflow:hidden}
.ed td textarea{width:100%;min-width:0;height:42px;min-height:42px;max-height:80px;padding:4px 5px;line-height:1.25;resize:vertical;overflow-y:auto;margin:0;font-size:11.5px}
.ed td:nth-child(2){width:42%}
.ed td:nth-child(n+3){width:auto}
.ed th button,.ed td button,.tr button{margin:0;padding:2px 6px}
@media(max-width:520px){.ed .sn{width:44px}.ed td:nth-child(2){width:38%}.ed td textarea{font-size:11px;padding:3px}}
.tr{display:grid;grid-template-columns:90px 1fr auto;gap:4px;margin-top:6px}
.tr textarea{min-height:32px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tb button{margin:0}
[hidden]{display:none!important}
button:disabled{opacity:.5;cursor:not-allowed}
.bad{border-color:var(--err)!important}
.ck{display:block;font-size:11px;color:var(--mute);margin:0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#rt{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#bar button{margin:0}#bar label{margin:0;color:var(--ink);font-size:14px;font-weight:700}
#bar input[type=checkbox],input[type=radio]{width:auto}
.dlb{background:var(--blue)!important;color:#fff!important;border:0!important;padding:8px 16px!important;font-weight:700}
dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:min(92vw,420px)}dialog::backdrop{background:rgba(0,0,0,.5)}
.op{display:block;font-size:14px;color:var(--ink);margin:6px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:820px){#app{flex-direction:column;height:auto}#ctl{width:auto;border:0;overflow:visible}#pv{overflow:visible}#rt{display:block}}
</style>
</head>
<body>
<div id="app">
<aside id="ctl">
<h1>Offer Letter PDF</h1><p class="m">A4 · runs in your browser · nothing is uploaded</p><div id="err" class="er" role="status"></div><div id="ver" class="er" role="status"></div>
<details open><summary>Letter</summary>
<div class="row3"><label>Prefix<input data-k="rp" placeholder="e.g. FPH"></label><label>Customer code<input data-k="rc" placeholder="e.g. NLC"></label><label>Serial no.<input type="number" min="1" data-k="rn"></label></div>
<label>Ref number (automatic, or type your own)<input data-k="ref" placeholder="e.g. FPH: NLC: 0230: 26"></label>
<label>Date<input type="date" data-k="date"></label>
<label>Address<textarea data-k="addr" rows="5" placeholder="Name, department, address"></textarea></label>
<label>Greeting<input data-k="sal" placeholder="e.g. Dear Sir,"></label>
<label>Subject<textarea data-k="subj" rows="2" placeholder="Subject line"></textarea></label>
<label>Opening line<textarea data-k="intro" rows="2" placeholder="Opening line before the table"></textarea></label>
</details>
<details open><summary>Table (1 to 6 columns)</summary>
<div class="tb"><input type="number" id="nr" min="1" max="50" value="1" title="How many rows to add" aria-label="How many rows to add" style="width:64px;margin:0"><button id="ar">+ Row</button><button id="ac">+ Column</button><button id="dl">Delete…</button></div>
<div class="tb" id="db" hidden><span class="m">Tick the rows or columns to delete.</span><button id="dd" disabled>Delete selected (0)</button><button id="dx">Cancel</button></div>
<label>Rows per page (1 to 8)<input type="number" min="1" max="8" data-k="per"></label>
<div class="sc"><div id="ed"></div></div>

<label>Note under table<input data-k="note" placeholder="Optional note"></label>
</details>
<details><summary>Terms and conditions</summary><div id="tm"></div><button id="at">+ Term</button></details>
<details><summary>Closing and signature</summary>
<label>Closing paragraph<textarea data-k="close" rows="3"></textarea></label>
<label>Line 1<input data-k="thx"></label><label>Line 2<input data-k="yf1"></label>
<label>Company line<input data-k="yf2"></label><label>Signatory line<input data-k="auth"></label>
</details>
<details><summary>Page space, stamp and font</summary>
<div class="row2"><label>Top space (mm)<input type="number" min="0" max="100" data-k="top"></label><label>Bottom space (mm)<input type="number" min="0" max="100" data-k="bot"></label></div>
<label>Stamp image (PNG or JPG)</label><input type="file" id="stf" accept="image/png,image/jpeg"><button id="str">Remove stamp</button>
<div class="row2"><label>Size (pt)<input type="number" data-k="ss"></label><label>Across (pt)<input type="number" data-k="sx"></label></div>
<label>Up / down (pt)<input type="number" data-k="sy"></label>
<label>Calibri regular (calibri.ttf)</label><input type="file" id="fr" accept=".ttf,.otf">
<label>Calibri bold (calibrib.ttf)</label><input type="file" id="fb" accept=".ttf,.otf">
<p class="m" id="fs"></p>
<label><input type="checkbox" data-k="bump"> Add 1 to the Ref number after each download</label>
</details>
</aside>
<div id="rt"><div id="bar"><label><input type="checkbox" id="ds" checked> Save draft</label><span class="m" id="dst" style="margin:0"></span><span style="flex:1"></span><button id="uc" hidden>Undo clear</button><button id="cl">Clear…</button><button class="dlb" id="dlb">Download PDF</button></div><main id="pv"></main></div>
</div>
<dialog id="cd"><b>Clear fields</b><p class="m">Clear everything, or choose which parts to clear? You can undo right after.</p>
<label class="op"><input type="radio" name="cm" value="all" checked> All fields</label>
<label class="op"><input type="radio" name="cm" value="pick"> Choose items</label>
<div id="ci" hidden><label class="op"><input type="checkbox" value="letter"> Address, greeting, subject, opening line</label><label class="op"><input type="checkbox" value="table"> Table contents (columns and rows stay)</label><label class="op"><input type="checkbox" value="note"> Note under table</label><label class="op"><input type="checkbox" value="terms"> Terms and conditions</label><label class="op"><input type="checkbox" value="closing"> Closing and signature lines</label><label class="op"><input type="checkbox" value="stamp"> Stamp image</label></div>
<p class="er" id="cm2"></p><div class="tb"><button id="cy">Clear</button><button id="cn">Cancel</button></div></dialog>
<script>
const {PDFDocument,StandardFonts,rgb}=PDFLib;
const $=id=>document.getElementById(id);
const W=595.28,H=841.89,L=56,R=56,CW=W-L-R,MM=72/25.4;
const D={ref:"",manual:false,rp:"FPH",rc:"NLC",rn:229,date:new Date().toISOString().slice(0,10),
addr:"The Deputy General Manager,\nTurbine Maintenance (O&M)\nNeyveli New Thermal Power Plant,\nNLC India Ltd, Block-26,\nNeyveli - 607803",
sal:"Dear Sir,",subj:"Ref : Budgetary offer for Repair and Reconditioning of LPBP Spary servo valve with spares.",
intro:"With reference to the above, we are pleased to submit our offer as follows:",per:5,top:38,bot:30,bump:true,
cols:["Sl. No.","Description","QTY (NOS.)","Unit Price Rs.","Amount Rs."],
rows:[],
note:"Note: Transit Insurance, P&F Charges, Transports Charges our scope",
terms:[["Prices","F.O.R.NLC Neyveli, GST 18% extra as applicable."],["Payment","100% within 30 days from the date of receipt of material at your end."],["Validity","30 days."],["Delivery","8 Weeks from the date of receipt of order at our end."],["Warranty","Rexroth warranty of 6 Month"]],
close:"We trust our offer is most competitive and we look forward to receiving your valuable order for prompt action at our end.",
thx:"Thanking you,",yf1:"Yours faithfully,",yf2:"For Fluid Power Hydraulics",auth:"Authorized signatory",stamp:"",ss:90,sx:40,sy:-10};
let S,autosave=true;try{autosave=localStorage.getItem("fph_ds")!=="0"}catch(e){}try{S={...D,...(autosave?JSON.parse(localStorage.getItem("fph2")||"{}"):{})}}catch(e){S={...D}}
// Clean any bad leftover columns from old drafts (e.g. "ram")
if(S.cols && S.cols.length>5){S.cols=S.cols.slice(0,5);S.rows.forEach(r=>{while(r.length>4)r.pop()})}
S.cols=(S.cols&&S.cols.length?S.cols:D.cols).map(c=>String(c||"").trim()||"Column");
// Keep whatever rows the user has (including 0). Never force example data.
if(!Array.isArray(S.rows)) S.rows = [];
S.rows=S.rows.map(r=>{const rr=r.slice(0,S.cols.length-1);while(rr.length<S.cols.length-1)rr.push("");return rr.map(v=>v==null||v===0?"":String(v))});

const FB={r:null,b:null},esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const save=()=>{if(!autosave){$("dst").textContent="Draft not saved";return}try{localStorage.setItem("fph2",JSON.stringify(S));$("dst").textContent="Draft saved "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}catch(e){$("dst").textContent="Could not save draft (storage full or blocked)"}};
let tm,rs=0,md,fR,fB,fd=true,dl=null;
const mkref=()=>[S.rp,S.rc,S.rn>0?String(Math.floor(S.rn)).padStart(4,"0"):"",S.date?S.date.slice(2,4):""].map(x=>String(x||"").trim()).filter(Boolean).join(": ");
function parts(){const m=S.ref.match(/^\s*([^:]*):\s*([^:]*):\s*(\d+)/);if(m){S.rp=m[1].trim();S.rc=m[2].trim();S.rn=+m[3]}}
function bumpRef(r){const m=/^(\s*[^:]*:\s*[^:]*:\s*)(\d+)/;return m.test(r)?r.replace(m,(a,p,n)=>p+String(+n+1).padStart(n.length,"0")):bump(r)}
const upd=()=>{if(!S.manual)S.ref=mkref();const rf=document.querySelector('[data-k="ref"]');if(rf)rf.value=S.ref;save();showV();clearTimeout(tm);tm=setTimeout(refresh,300)};
function validate(){const er=[];document.querySelectorAll(".bad").forEach(x=>x.classList.remove("bad"));
 const f=k=>document.querySelector('[data-k="'+k+'"]'),bad=(k,m)=>{f(k).classList.add("bad");er.push(m)};
 const pv=+f("per").value;if(f("per").value===""||!Number.isInteger(pv)||pv<1||pv>8)bad("per","Rows per page must be a whole number from 1 to 8");
 ["top","bot"].forEach(k=>{const v=f(k).value;if(v===""||isNaN(+v)||+v<0||+v>100)bad(k,"Top and bottom space must be 0 to 100 mm")});
 if(+f("top").value+ +f("bot").value>200)bad("top","Top and bottom space leave too little room");
 if(S.manual){if(!S.ref.trim())bad("ref","Enter a Ref number")}else{if(!(+S.rn>=1)||!Number.isInteger(+S.rn))bad("rn","Serial number must be a whole number, 1 or more");if(!S.rp.trim())bad("rp","Enter the Ref prefix")}
 if(!S.date||isNaN(new Date(S.date)))bad("date","Choose a valid date");
 if(!S.addr.trim())bad("addr","Enter the address");
 if(!S.subj.trim())bad("subj","Enter the subject");
 if(!S.rows.length)er.push("Add at least one table row");
 else if(S.cols.length>1&&S.rows.some(r=>!String(r[0]).trim()))er.push("Every row needs a "+(S.cols[1]||"description"));
 if(S.terms.some(t=>!!t[0].trim()!==!!t[1].trim()))er.push("Each term needs both a heading and details");
 if(S.cols.some(c=>!c.trim()))er.push("Column names cannot be empty");
 if(S.stamp){const s=f("ss").value;if(!(+s>=20&&+s<=300))bad("ss","Stamp size must be 20 to 300 pt")}
 return er}
function showV(){$("ver").textContent=validate().join(" · ")}
const fmt=i=>{const d=new Date(i+"T00:00:00");return isNaN(d)?"":String(d.getDate()).padStart(2,"0")+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+d.getFullYear()};
const bump=r=>r.replace(/\d{3,}/,m=>String(+m+1).padStart(m.length,"0"));
const u8=d=>Uint8Array.from(atob(d.split(",")[1]),c=>c.charCodeAt(0));
const dm={},imgs={};
const dims=d=>!d?Promise.resolve(null):(dm[d]||(dm[d]=new Promise(r=>{const i=new Image();i.onload=()=>{imgs[d]=i;r([i.naturalWidth,i.naturalHeight])};i.onerror=()=>r([1,1]);i.src=d})));
const idb=(m,k,v)=>new Promise(r=>{try{const q=indexedDB.open("pm",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>{const s=q.result.transaction("f",m==="get"?"readonly":"readwrite").objectStore("f"),x=m==="get"?s.get(k):s.put(v,k);x.onsuccess=()=>r(x.result);x.onerror=()=>r()};q.onerror=()=>r()}catch(e){r()}});
async function fonts(){if(!fd&&fR)return;md=await PDFDocument.create();if(window.fontkit)md.registerFontkit(fontkit);
 fR=FB.r?await md.embedFont(FB.r):await md.embedFont(StandardFonts.Helvetica);fB=FB.b?await md.embedFont(FB.b):await md.embedFont(StandardFonts.HelveticaBold);fd=false}
async function layout(){
 const st=await dims(S.stamp);
 const topY=S.top*MM,botY=H-S.bot*MM;
 const pages=[];let y=0,cnt=0;
 const np=()=>{const o=[];pages.push(o);y=topY;cnt=0};np();
 const cur=()=>pages[pages.length-1],tw=(s,b,z)=>(b?fB:fR).widthOfTextAtSize(s,z);
 const wrap=(s,b,z,mw)=>{const out=[];for(const p of String(s??"").split("\n")){let l="";for(const w of p.split(" ")){let word=w;
      // hard-break extremely long words
      while(tw(word,b,z)>mw && word.length>1){let i=word.length;while(i>1&&tw(word.slice(0,i),b,z)>mw)i--;out.push(word.slice(0,i));word=word.slice(i)}
      const t=l?l+" "+word:word;if(l&&tw(t,b,z)>mw){out.push(l);l=word}else l=t}if(l!==undefined)out.push(l)}return out.filter(x=>x!==undefined)};
 const blk=(s,x=L,w=CW,b=0,z=11,lh=14)=>{for(const l of wrap(s,b,z,w)){if(y+lh>botY)np();if(l)cur().push({t:"t",s:l,x,y:y+z*.8,b,z});y+=lh}};
 const ds=S.date?"Date: "+fmt(S.date):"";
 if(S.ref)cur().push({t:"t",s:"REF: "+S.ref,x:L,y:y+9,b:1,z:11});
 if(ds)cur().push({t:"t",s:ds,x:W-R-tw(ds,1,11),y:y+9,b:1,z:11});
 y+=34;blk(S.addr);y+=16;blk(S.sal);y+=10;blk(S.subj);y+=10;blk(S.intro);y+=10;
 const n=S.cols.length,cw=[];
 // Better widths: S.No fixed, Description prioritised, remaining columns share fairly
 if(n===1){cw.push(CW)}
 else{
   const snW=34;
   const remaining=CW-snW;
   const otherCount=Math.max(0,n-2);
   // Give description more room when few columns, slightly less when many
   const descShare = otherCount<=2 ? 0.48 : otherCount===3 ? 0.42 : 0.36;
   let otherW = otherCount>0 ? Math.floor((remaining*(1-descShare))/otherCount) : 0;
   otherW = Math.max(52, Math.min(otherW, 90));          // clamp
   const descW = remaining - (otherW*otherCount);
   cw.push(snW);
   cw.push(Math.max(120, descW));
   for(let i=2;i<n;i++)cw.push(otherW);
   // safety: if sum drifted, adjust last column
   const sum = cw.reduce((a,b)=>a+b,0);
   if(sum!==CW) cw[cw.length-1] += (CW-sum);
 }
 const xs=[];cw.reduce((a,c)=>(xs.push(a),a+c),L);
 const PAD=5; // padding inside each cell so text never crosses the line
 const LH=12.0; // line height for table cells
 const mz=(cells,hdr)=>{
   const z=hdr?10.5:9.7;
   const ls=cells.map((c,i)=>wrap(String(c??"").trim(),hdr,z,Math.max(18,cw[i]-PAD*2)));
   const maxLines=Math.max(1,...ls.map(a=>a.length||1));
   return{ls,hdr,z,h:Math.max(20, maxLines*LH + 9)};
 };
 const dr=m=>{const o=cur();
  // outer box + verticals
  o.push({t:"l",x1:L,y1:y,x2:L+CW,y2:y},{t:"l",x1:L,y1:y+m.h,x2:L+CW,y2:y+m.h},{t:"l",x1:L+CW,y1:y,x2:L+CW,y2:y+m.h});
  xs.forEach(x=>o.push({t:"l",x1:x,y1:y,x2:x,y2:y+m.h}));
  // text – vertically centred when few lines, never outside cell
  const contentH = Math.max(...m.ls.map(a=>(a.length||1)*LH));
  const topPad = Math.max(4, (m.h - contentH)/2);
  m.ls.forEach((ls,i)=>{
    const lines = ls.length ? ls : [""];
    lines.forEach((s,k)=>{
      if(!s)return;
      const center = m.hdr || i!==1;
      const tx = center ? xs[i]+(cw[i]-tw(s,m.hdr,m.z))/2 : xs[i]+PAD;
      // clamp so we never start past the right edge
      const maxX = xs[i]+cw[i]-PAD-2;
      const finalX = Math.min(tx, maxX);
      o.push({t:"t",s,x:finalX,y:y+topPad+k*LH+m.z*0.75,b:m.hdr?1:0,z:m.z});
    });
  });
  y+=m.h};
 const hm=mz(S.cols,1);if(y+hm.h+40>botY)np();dr(hm);
 S.rows.forEach((r,i)=>{const m=mz([String(i+1),...r],0);if(y+m.h>botY||cnt>=S.per)np();dr(m);cnt++});
 const tail=g=>{if(g)y+=12;if(S.note){blk(S.note);y+=10}
 if(S.terms.length){const T="TERMS & CONDITIONS:-";blk(T,L,CW,1);cur().push({t:"l",x1:L,y1:y-2.5,x2:L+tw(T,1,11),y2:y-2.5});y+=4;
  S.terms.forEach(([k,v],i)=>{const ls=wrap(": "+v,0,11,CW-110),h=ls.length*14;if(y+h>botY)np();const o=cur();o.push({t:"t",s:(i+1)+". "+k,x:L,y:y+8.8,b:0,z:11});ls.forEach((s,j)=>s&&o.push({t:"t",s,x:L+108,y:y+j*14+8.8,b:0,z:11}));y+=h});y+=12}
 blk(S.close);y+=10;blk(S.thx);y+=8;
 if(y+122>botY)np();
 const sy=y;blk(S.yf1);blk(S.yf2);y+=66;blk(S.auth);
 if(st&&S.stamp){const w=+S.ss||90;cur().push({t:"i",d:S.stamp,x:L+(+S.sx||0),y:sy+(+S.sy||0),w,h:w*st[1]/st[0]})}};
 const pn=pages.length,y0=y,n0=cur().length;tail(1);
 if(pages.length>pn){pages.length=pn;pages[pn-1].length=n0;y=y0;np();tail(0)}
 return pages}
function draw(pages){const pv=$("pv");pv.innerHTML="";const ff=FB.r?"PM,Arial,sans-serif":"Arial,Helvetica,sans-serif",k=1.6;
 pages.forEach(o=>{const c=document.createElement("canvas");c.width=W*k;c.height=H*k;c.className="pgc";const x=c.getContext("2d");x.scale(k,k);x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#000";x.strokeStyle="#000";x.lineWidth=.7;
  o.forEach(p=>{if(p.t==="t"){x.font=(p.b?"bold ":"")+p.z+"px "+ff;x.fillText(p.s,p.x,p.y)}else if(p.t==="l"){x.beginPath();x.moveTo(p.x1,p.y1);x.lineTo(p.x2,p.y2);x.stroke()}else if(imgs[p.d])x.drawImage(imgs[p.d],p.x,p.y,p.w,p.h)});pv.append(c)})}
async function refresh(){const q=++rs;try{await fonts();const p=await layout();if(q!==rs)return;draw(p);$("err").textContent=""}catch(e){$("err").textContent="Cannot render: "+(e.message||e)+". If a character is not supported, upload the Calibri font files."}}
async function download(){const ev=validate();if(ev.length){$("ver").textContent=ev.join(" · ");$("err").textContent="Fix the highlighted items before downloading.";return}const b=$("dlb");b.disabled=true;try{await fonts();const pages=await layout(),doc=await PDFDocument.create();if(window.fontkit)doc.registerFontkit(fontkit);
 const fr=FB.r?await doc.embedFont(FB.r):await doc.embedFont(StandardFonts.Helvetica),fb=FB.b?await doc.embedFont(FB.b):await doc.embedFont(StandardFonts.HelveticaBold),ca={};
 for(const o of pages){const g=doc.addPage([W,H]);for(const p of o){
  if(p.t==="t")g.drawText(p.s,{x:p.x,y:H-p.y,size:p.z,font:p.b?fb:fr,color:rgb(0,0,0)});
  else if(p.t==="l")g.drawLine({start:{x:p.x1,y:H-p.y1},end:{x:p.x2,y:H-p.y2},thickness:.7,color:rgb(0,0,0)});
  else{if(!ca[p.d])ca[p.d]=/^data:image\/png/.test(p.d)?await doc.embedPng(u8(p.d)):await doc.embedJpg(u8(p.d));g.drawImage(ca[p.d],{x:p.x,y:H-p.y-p.h,width:p.w,height:p.h})}}}
 const bytes=await doc.save(),name="Offer-"+(S.ref||"letter").replace(/[^\w]+/g,"-")+".pdf";
 if(dl)await dl.save({filename:name,data:bytes});else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));a.download=name;document.body.append(a);a.click();a.remove()}
 if(S.bump){if(S.manual){S.ref=bumpRef(S.ref);parts()}else S.rn=(+S.rn||0)+1;upd();["rp","rc","rn","ref"].forEach(x=>document.querySelector('[data-k="'+x+'"]').value=S[x])}
 $("err").textContent=""}catch(e){if(!e||e.code!=="declined")$("err").textContent="Could not create PDF: "+(e.message||e.code||e)}b.disabled=false}
function edit(){const n=S.cols.length;$("ac").disabled=n>=6;let h='<table class="ed"><tr>'+S.cols.map((c,i)=>'<th>'+(dmode&&i>0?'<label class="ck"><input type="checkbox" data-sc="'+i+'"'+(sc.has(i)?" checked":"")+'> delete column</label>':"")+'<textarea data-c="'+i+'" rows="1" aria-label="Column name">'+esc(c)+'</textarea></th>').join("")+"</tr>";
 S.rows.forEach((r,ri)=>{
   const icons=dmode
     ? '<input type="checkbox" data-sr="'+ri+'" aria-label="Delete row '+(ri+1)+'"'+(sr.has(ri)?" checked":"")+'>'
     : '<button type="button" class="ico-edit" data-ed="'+ri+'" title="Edit the complete item row" aria-label="Edit the complete item row">✎</button>';
   h+='<tr><td class="sn">'+icons+' <span class="num">'+(ri+1)+'</span></td>'+r.map((v,j)=>'<td><textarea data-r="'+ri+'" data-j="'+j+'" rows="2" title="'+esc(v)+'">'+esc(v)+'</textarea></td>').join("")+"</tr>";
 });
 $("ed").innerHTML=h+"</table>";
 $("tm").innerHTML=S.terms.map((t,i)=>'<div class="tr"><input data-ti="'+i+'" data-tp="0" value="'+esc(t[0])+'" placeholder="Heading"><textarea data-ti="'+i+'" data-tp="1" rows="2" placeholder="Details">'+esc(t[1])+'</textarea><button data-dt="'+i+'" aria-label="Remove term">✕</button></div>').join("")}
const grow=t=>{t.style.height="auto";t.style.height=t.scrollHeight+"px"};
$("ed").addEventListener("input",e=>{const d=e.target.dataset;if(e.target.tagName==="TEXTAREA"&&e.target.closest("#ed")&&e.target.dataset.r!==undefined)e.target.title=e.target.value;if(d.c!==undefined)S.cols[+d.c]=e.target.value;else if(d.r!==undefined)S.rows[+d.r][+d.j]=e.target.value;upd()});
$("ed").addEventListener("click",e=>{
 const d=e.target.dataset, btn=e.target.closest("button");
 if(btn&&btn.dataset.ed!==undefined){ // Pencil – open edit prompt with full row content
   const i=+btn.dataset.ed, r=S.rows[i];
   if(!r)return;
   openRowEdit(i);
   return;
 }
 if(d.rc){S.cols.splice(+d.rc,1);S.rows.forEach(r=>r.splice(+d.rc-1,1))}
 else if(d.dr)S.rows.splice(+d.dr,1);
 else return;
 edit();upd();
});

function openRowEdit(i){
  const r=S.rows[i];
  if(!r)return;
  // Build a simple prompt dialog pre-filled with current values
  let existing = document.getElementById("rowEditDlg");
  if(existing) existing.remove();
  const dlg = document.createElement("dialog");
  dlg.id = "rowEditDlg";
  dlg.innerHTML = `
    <b>Edit item ${i+1}</b>
    <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
      ${S.cols.slice(1).map((c,j)=>`
        <label style="margin:0">${esc(c)}
          <textarea data-ef="${j}" rows="${j===0?4:2}" style="width:100%;margin-top:2px">${esc(r[j]||"")}</textarea>
        </label>`).join("")}
    </div>
    <div class="tb" style="margin-top:14px">
      <button type="button" id="rowSave" class="dlb" style="margin:0">Save</button>
      <button type="button" id="rowCancel" style="margin:0">Cancel</button>
    </div>`;
  document.body.appendChild(dlg);
  dlg.showModal();
  const first = dlg.querySelector("textarea");
  if(first){first.focus(); first.setSelectionRange(first.value.length, first.value.length);}
  dlg.querySelector("#rowCancel").onclick = ()=>dlg.close();
  dlg.querySelector("#rowSave").onclick = ()=>{
    dlg.querySelectorAll("[data-ef]").forEach(el=>{
      r[+el.dataset.ef] = el.value;
    });
    dlg.close();
    edit(); upd();
  };
  dlg.addEventListener("close", ()=>dlg.remove());
}
$("tm").addEventListener("input",e=>{const d=e.target.dataset;if(d.ti!==undefined){S.terms[+d.ti][+d.tp]=e.target.value;upd()}});
$("tm").addEventListener("click",e=>{const d=e.target.dataset;if(d.dt!==undefined){S.terms.splice(+d.dt,1);edit();upd()}});
$("ac").onclick=()=>{if(S.cols.length>=6)return;S.cols.push("Column "+S.cols.length);S.rows.forEach(r=>r.push(""));edit();upd()};
$("ar").onclick=()=>{const k=Math.min(50,Math.max(1,Math.floor(+$("nr").value)||1));for(let i=0;i<k;i++)S.rows.push(Array(S.cols.length-1).fill(""));$("nr").value=1;edit();upd()};
$("at").onclick=()=>{S.terms.push(["",""]);edit();upd()};
let dmode=false;const sr=new Set(),sc=new Set();
const cntSel=()=>{$("dd").textContent="Delete selected ("+(sr.size+sc.size)+")";$("dd").disabled=!(sr.size+sc.size)};
const mode=on=>{dmode=on;sr.clear();sc.clear();$("db").hidden=!on;$("dl").hidden=on;edit();cntSel()};
$("dl").onclick=()=>mode(true);$("dx").onclick=()=>mode(false);
$("dd").onclick=()=>{const cs=[...sc].sort((a,b)=>b-a);S.rows=S.rows.filter((_,i)=>!sr.has(i));cs.forEach(c=>{S.cols.splice(c,1);S.rows.forEach(r=>r.splice(c-1,1))});mode(false);upd()};
$("ed").addEventListener("change",e=>{const d=e.target.dataset;if(d.sc!==undefined)e.target.checked?sc.add(+d.sc):sc.delete(+d.sc);else if(d.sr!==undefined)e.target.checked?sr.add(+d.sr):sr.delete(+d.sr);else return;cntSel()});
document.querySelectorAll("[data-k]").forEach(e=>{const k=e.dataset.k;if(e.type==="checkbox")e.checked=!!S[k];else e.value=S[k];
 e.oninput=()=>{const v=e.value;if(k==="ref")S.manual=true;if(k==="rp"||k==="rc"||k==="rn")S.manual=false;S[k]=e.type==="checkbox"?e.checked:e.type==="number"?(k==="per"?(Number.isInteger(+v)&&+v>=1&&+v<=8?+v:S.per):k==="top"||k==="bot"?Math.min(100,Math.max(0,+v||0)):k==="ss"?Math.min(300,Math.max(20,+v||90)):(+v||0)):v;if(k==="ref"){parts();["rp","rc","rn"].forEach(x=>document.querySelector('[data-k="'+x+'"]').value=S[x])}upd()}});
$("stf").onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg)$/.test(f.type)){$("err").textContent="Stamp must be a PNG or JPG.";return}
 const r=new FileReader();r.onload=()=>{S.stamp=r.result;upd()};r.readAsDataURL(f)};
$("str").onclick=()=>{S.stamp="";$("stf").value="";upd()};
function face(){["r","b"].forEach(k=>{if(FB[k])new FontFace("PM",FB[k].slice(),{weight:k==="b"?"700":"400"}).load().then(f=>document.fonts.add(f)).then(()=>{if(rs)upd()}).catch(()=>{})});
 $("fs").textContent=(FB.r?"Regular font loaded. ":"No regular font: using Arial-style. ")+(FB.b?"Bold font loaded.":"No bold font: using Arial-style bold.")}
function fup(id,k){$(id).onchange=async e=>{const f=e.target.files[0];if(!f)return;const b=new Uint8Array(await f.arrayBuffer()),m=String.fromCharCode(...b.slice(0,4));
 if(!(m==="\0\x01\0\0"||m==="true"||m==="OTTO")){$("err").textContent="That does not look like a font file (.ttf or .otf).";return}
 FB[k]=b;await idb("put",k,b);fd=true;face();upd()}}
fup("fr","r");fup("fb","b");$("dlb").onclick=download;
$("ds").checked=autosave;
$("ds").onchange=()=>{autosave=$("ds").checked;try{localStorage.setItem("fph_ds",autosave?"1":"0");if(!autosave)localStorage.removeItem("fph2")}catch(e){}save()};
let snap=null;
const clr={letter:()=>{S.addr=S.sal=S.subj=S.intro=""},table:()=>{S.rows=S.rows.map(r=>r.map(()=>""))},note:()=>{S.note=""},terms:()=>{S.terms=[]},closing:()=>{S.close=S.thx=S.yf1=S.yf2=S.auth=""},stamp:()=>{S.stamp="";$("stf").value=""}};
function sync(){document.querySelectorAll("[data-k]").forEach(e=>{const k=e.dataset.k;if(e.type==="checkbox")e.checked=!!S[k];else e.value=S[k]});edit();upd()}
$("cl").onclick=()=>{$("cm2").textContent="";$("cd").showModal()};
document.querySelectorAll('[name="cm"]').forEach(r=>r.onchange=()=>{$("ci").hidden=document.querySelector('[name="cm"]:checked').value!=="pick"});
$("cn").onclick=()=>$("cd").close();
$("cy").onclick=()=>{const all=document.querySelector('[name="cm"]:checked').value==="all",ks=all?Object.keys(clr):[...document.querySelectorAll("#ci input:checked")].map(i=>i.value);
 if(!ks.length){$("cm2").textContent="Tick at least one item.";return}
 snap=JSON.stringify(S);ks.forEach(k=>clr[k]());
 $("cd").close();$("uc").hidden=false;sync()};
$("uc").onclick=()=>{if(!snap)return;S=JSON.parse(snap);snap=null;$("uc").hidden=true;sync()};
try{window.claude&&claude.use("downloads").then(d=>{dl=d}).catch(()=>{})}catch(e){}
(async()=>{FB.r=(await idb("get","r"))||null;FB.b=(await idb("get","b"))||null;fd=true;face();edit();upd();refresh()})();
</script>
